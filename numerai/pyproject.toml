[project]
name = "mirofish-numerai"
version = "0.1.0"
description = "MiroFish Numerai Multi-Agent Prediction Pipeline - Uses MiroFish's LLM-powered agent system for ensemble predictions"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # Numerai API client
    "numerapi>=2.20.0",

    # Data processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",

    # Machine learning
    "lightgbm>=4.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",

    # LLM client (same as MiroFish backend, for agent configuration)
    "openai>=1.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
